name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build and check wheel and source distribution
        run: |
          python -m pip install build==1.5.0 twine==6.2.0
          python -m build
          python -m twine check --strict dist/*

      - name: Verify release artifacts
        run: |
          python - <<'PY'
          import email.parser
          import os
          import pathlib
          import zipfile

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"Expected one wheel and one sdist; found {wheels!r} and {sdists!r}"
              )

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_paths = [
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_paths) != 1:
                  raise SystemExit(f"Expected one METADATA file; found {metadata_paths!r}")
              metadata = email.parser.BytesParser().parsebytes(
                  archive.read(metadata_paths[0])
              )

          expected_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if metadata["Name"] != "flashspread":
              raise SystemExit(f"Unexpected package name: {metadata['Name']!r}")
          if metadata["Version"] != expected_version:
              raise SystemExit(
                  f"Release tag expects {expected_version!r}, "
                  f"but the wheel contains {metadata['Version']!r}"
              )
          PY

      - name: Store release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/flashspread
    permissions:
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
