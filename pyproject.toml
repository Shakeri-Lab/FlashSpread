[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flashspread"
version = "1.0.0"
description = "FlashSpread: GPU-accelerated Markovian and Non-Markovian Spreading Processes on Complex Networks"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Heman Shakeri", email = "hs9hd@virginia.edu"}
]
keywords = [
    "epidemic simulation",
    "stochastic processes",
    "GPU computing",
    "network epidemiology",
    "Markovian",
    "non-Markovian",
    "renewal processes",
    "tau-leaping"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "triton>=2.1",
    "networkx>=3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/Shakeri-Lab/FlashSpread"
Repository = "https://github.com/Shakeri-Lab/FlashSpread.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["flashspread*"]
